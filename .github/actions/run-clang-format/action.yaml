name: Run clang-format
description: Runs clang-format and checks for any changes introduced by it
inputs:
  failCondition:
    description: Controls whether failed checks also fail the workflow run
    required: false
    default: never
  workingDirectory:
    description: Working directory for checks
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Check Runner Operating System 🏃‍♂️
      if: runner.os == 'Windows'
      shell: bash
      run: |
        : Check Runner Operating System 🏃‍♂️
        echo "::notice::run-clang-format action requires a macOS-based or Linux-based runner."
        exit 2

    - name: Check for Changed Files ✅
      uses: ./.github/actions/check-changes
      id: checks
      with:
        checkGlob: "'*.c' '*.h' '*.cpp' '*.hpp' '*.m' '*.mm'"
        diffFilter: 'ACM'

    - name: Install Dependencies 🛍️
      if: runner.os == 'Linux' && fromJSON(steps.checks.outputs.hasChangedFiles)
      shell: bash
      run: |
        : Install Dependencies 🛍️
        echo ::group::Install Dependencies
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
        echo "/home/linuxbrew/.linuxbrew/opt/clang-format@19/bin" >> $GITHUB_PATH
        brew install --quiet zsh
        echo ::endgroup::

    - name: Run clang-format 🐉
      if: fromJSON(steps.checks.outputs.hasChangedFiles)
      id: result
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CHANGED_FILES: ${{ steps.checks.outputs.changedFiles }}
      run: |
        : Run clang-format 🐉
        if (( ${+RUNNER_DEBUG} )) setopt XTRACE

        print ::group::Install clang-format-19
        # Homebrew refuse les taps tiers non « trustés » (« Skipping
        # obsproject/tools because it is not trusted ») et casse régulièrement
        # sur ce tap (vu le 2026-07-29 : « unknown install step: run »). Ces
        # pannes n'ont RIEN à voir avec le formatage du code, mais faisaient
        # échouer la CI. On tente Homebrew, et à défaut on prend clang-format 19
        # depuis PyPI — même version, même sortie (vérifié en 19.1.7).
        brew tap --quiet obsproject/tools 2>/dev/null || true
        brew trust obsproject/tools 2>/dev/null || true
        if ! brew install --quiet obsproject/tools/clang-format@19 2>/dev/null; then
          print '::notice::Homebrew indisponible pour clang-format@19 — repli sur PyPI'
          # ⚠️ EXACTEMENT 19.1.1 : build-aux/run-clang-format refuse aussi bien
          # une version plus ancienne QUE plus récente (double is-at-least).
          pip3 install --quiet --break-system-packages 'clang-format==19.1.1'
          # build-aux/run-clang-format cherche le binaire « clang-format-19 » :
          # on lui fournit ce nom (le paquet PyPI installe « clang-format »).
          local bin=${HOME}/.vx-clang-format/bin
          mkdir -p ${bin}
          printf '#!/bin/sh\nexec clang-format "$@"\n' > ${bin}/clang-format-19
          chmod +x ${bin}/clang-format-19
          print ${bin} >> $GITHUB_PATH
          path=(${bin} ${path})
        fi
        print ::endgroup::

        print ::group::Run clang-format-19
        local -a changes=(${(s:,:)CHANGED_FILES//[\[\]\'\"]/})
        ./build-aux/run-clang-format --fail-${{ inputs.failCondition }} --check ${changes}
        print ::endgroup::
